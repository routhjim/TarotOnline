<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=EB+Garamond:wght@400;500;600&family=Pirata+One&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:radial-gradient(circle at 50% 30%,#2f5e46,#1c3b2c 60%,#122718);min-height:100vh;font-family:'EB Garamond',serif;padding:34px 20px 60px}
select{font-family:'EB Garamond',serif}
</style>
</helmet>
<div style="max-width:1100px;margin:0 auto">
  <div style="display:flex;align-items:flex-end;justify-content:space-between;flex-wrap:wrap;gap:14px;margin-bottom:26px">
    <div>
      <div style="font-family:'Pirata One',serif;font-size:40px;color:#d9bd7e;line-height:1">Card styles</div>
      <div style="font-size:15px;color:rgba(236,223,189,.65);letter-spacing:1px">Preview &mdash; pick a style from the menu</div>
    </div>
    {{ styleMenu }}
  </div>

  <div style="margin-bottom:30px">
    <div style="font-size:13px;letter-spacing:2px;text-transform:uppercase;color:rgba(216,189,126,.7);margin-bottom:12px;border-bottom:1px solid rgba(216,189,126,.25);padding-bottom:6px">Trumps &amp; honours</div>
    <div style="display:flex;gap:16px;flex-wrap:wrap">{{ trumpRow }}</div>
  </div>

  <div style="margin-bottom:30px">
    <div style="font-size:13px;letter-spacing:2px;text-transform:uppercase;color:rgba(216,189,126,.7);margin-bottom:12px;border-bottom:1px solid rgba(216,189,126,.25);padding-bottom:6px">Court cards</div>
    <div style="display:flex;gap:16px;flex-wrap:wrap">{{ courtRow }}</div>
  </div>

  <div>
    <div style="font-size:13px;letter-spacing:2px;text-transform:uppercase;color:rgba(216,189,126,.7);margin-bottom:12px;border-bottom:1px solid rgba(216,189,126,.25);padding-bottom:6px">Pip cards</div>
    <div style="display:flex;gap:16px;flex-wrap:wrap">{{ pipRow }}</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>

  tradCard(card,w){const E=React.createElement;const h=Math.round(w*161/89);const S=this.SEPIA;
    const isT=card.kind==='trump';const suit=isT?null:this.SUIT[card.suit];const main=isT?'#2b2620':suit.c;

  tradCardDrawn(card,w){const E=React.createElement;const h=Math.round(w*1.5);const S=this.SEPIA,GOLD=this.GOLD;

      courtRow:courts.map((c,i)=>E('div',{key:i},this.card(c,w))),
      pipRow:pips.map((c,i)=>E('div',{key:i},this.card(c,w)))};}
}
</script>
