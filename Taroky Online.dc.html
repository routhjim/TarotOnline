<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  GOLD='#b8975a'; GOLDL='#d9bd7e'; INK='#2b2620';
  SUIT={hearts:{g:'\u2665',c:'#a8362b'},diamonds:{g:'\u2666',c:'#a8362b'},spades:{g:'\u2660',c:'#26333c'},clubs:{g:'\u2663',c:'#26333c'}};
  bonusName={hrube:'Hrub\u00e1',tarocy:'Taroky',bite:'B\u00edda',uni:'Uni',pawnee:'P\u00e1n\u00ed',trul:'Trul',rosanna:'Rosanna'};
  bonusVal={hrube:4,tarocy:2,bite:2,uni:4,pawnee:2,trul:2,rosanna:4};
  state={scale:1,mobile:false,cardStyle:'standard',heldHidden:null,connected:false,connecting:false,view:null,seat:null,seats:null,toast:'',tables:[],newTable:'',
    url:'wss://tarotonlinegame-production.up.railway.app',room:'',name:'Player',
    aiChoice:'advanced',leaderboard:[],showTricks:false,chat:[],chatOpen:false,chatInput:'',chatUnread:0,sel:[],declSel:{bonuses:[],ultimo:false,contra:false,rey:false,pagatContra:false},hovered:null,lastPhase:null};

  componentDidMount(){try{const cs=localStorage.getItem('taroky-cardstyle');if(cs==='traditional'||cs==='standard')this.setState({cardStyle:cs});}catch(e){}try{const pp=localStorage.getItem('taroky-playerpw');if(pp)this.setState({playerPw:pp});}catch(e){}this.fit();this._onR=()=>this.fit();window.addEventListener('resize',this._onR);this.connect();this._lobbyPoll=setInterval(()=>{if(!this._dead&&this.ws&&this.ws.readyState===1&&!this.state.view)this.send({type:'list'});},3000);
    // App-level keepalive: some proxies drop WebSockets that carry no data frames.
    this._keepAlive=setInterval(()=>{if(!this._dead&&this.ws&&this.ws.readyState===1){this.send({type:'ping'});if(this.state.view)this._saveSession();}},25000);}
  componentWillUnmount(){this._dead=true;clearInterval(this._lobbyPoll);clearInterval(this._keepAlive);clearTimeout(this._rt);window.removeEventListener('resize',this._onR);if(this.ws)try{this.ws.close();}catch(e){}}

  // ---- session persistence (survives reloads and short disconnects) ----
  _saveSession(){try{localStorage.setItem('taroky-session',JSON.stringify({room:this.state.room,token:this._token,name:this.state.name,ts:Date.now()}));}catch(e){}}
  _loadSession(){try{const s=JSON.parse(localStorage.getItem('taroky-session')||'null');if(s&&s.room&&s.token&&(Date.now()-(s.ts||0))<150000)return s;}catch(e){}return null;}
  _clearSession(){try{localStorage.removeItem('taroky-session');}catch(e){}this._token=null;}
  fit(){const w=window.innerWidth,h=window.innerHeight;const s=Math.min(w/1340,h/820);this.setState({scale:s,mobile:w<820&&h>=w,winW:w,winH:h});}
  toast(m){this.setState({toast:m});clearTimeout(this._tt);this._tt=setTimeout(()=>{if(!this._dead)this.setState({toast:''});},2600);}

  // ---- networking (auto-connects to its own host; table lobby via 'tables') ----
  connect(){if(this.ws)try{this.ws.close();}catch(e){}
    let url=this.state.url;try{const p=location.protocol;if(p==='https:'||p==='http:')url=(p==='https:'?'wss':'ws')+'://'+location.host;}catch(e){}
    let ws;try{ws=new WebSocket(url);}catch(e){this.toast('Cannot reach server');return;}
    this.ws=ws;this.setState({connecting:true});
    // A socket can wedge in CONNECTING (no onclose) on bad networks — time it out so the retry chain keeps moving.
    clearTimeout(this._ct);this._ct=setTimeout(()=>{if(ws.readyState===0){try{ws.close();}catch(e){}if(ws.onclose)ws.onclose();}},6000);

      else{const sess=this._loadSession();if(sess){this._token=sess.token;this.setState({room:sess.room,name:sess.name||this.state.name});this.send({type:'join',roomId:sess.room,name:sess.name||'Player',token:sess.token,playerPw:(this.state.playerPw||'').trim()});}}};
    ws.onclose=()=>{if(this._dead)return;

      const n=(this._retry=(this._retry||0)+1);

      else{this.setState({connected:false,connecting:false,view:null});this.toast('Could not reconnect \u2014 back to the lobby.');}};
    ws.onerror=()=>{if(this._dead)return;this.setState({connecting:false});};
    ws.onmessage=(ev)=>{if(this._dead)return;let m;try{m=JSON.parse(ev.data);}catch(e){return;}

      else if(m.type==='joined'){this._token=m.token||this._token;this.setState({seat:m.seat,seats:m.seats,room:m.roomId||this.state.room});this._saveSession();}
      else if(m.type==='state')this.applyView(m.view);
      else if(m.type==='pong'){}
      else if(m.type==='chatHistory')this.setState({chat:(m.messages||[]).slice(-50)});
      else if(m.type==='chat'){const chat=this.state.chat.concat([m.message]).slice(-100);const patch={chat:chat};if(!this.state.chatOpen&&m.message.seat!==this.state.seat)patch.chatUnread=this.state.chatUnread+1;this.setState(patch,()=>{const el=document.getElementById('chat-scroll');if(el)el.scrollTop=el.scrollHeight;});}

      else if(m.type==='info')this.toast(m.message||'OK');

  applyView(view){const prev=this.state.lastPhase;const reset=(view.phase!==prev);const patch={view:view,seat:view.you,lastPhase:view.phase};

    this.setState(patch);}
  sendAction(a){if(this.ws&&this.ws.readyState===1)this.ws.send(JSON.stringify({type:'action',action:a}));}
  send(o){if(this.ws&&this.ws.readyState===1)this.ws.send(JSON.stringify(o));}

  seatAt(pos){const you=this.state.view.you;const off={S:0,E:1,N:2,W:3}[pos];return (you+off)%4;}

  // Traditional style: restored scans of the 19th-century Wuest Tarock deck (public domain), stored locally in cards/

    const m=window.TAROKY_CARD_IMAGES;return (m&&m[nm])||('cards/'+nm+'.gif');}
  tradCardEl(card,opt,w){const E=React.createElement;const th=Math.round(w*161/89);const isT=card.kind==='trump';const suit=isT?null:this.SUIT[card.suit];const main=isT?'#2b2620':suit.c;
    return E('div',{key:opt.key,onClick:opt.onClick,onMouseEnter:opt.onMouseEnter,onMouseLeave:opt.onMouseLeave,title:opt.title||'',style:{width:w,height:th,borderRadius:w*0.06,background:'#f4ecd8',border:'1px solid #8a7550',boxShadow:opt.outline?'0 0 0 2px '+this.GOLDL+',0 8px 16px rgba(0,0,0,.4)':'0 6px 13px rgba(0,0,0,.4)',position:'relative',overflow:'hidden',flex:'0 0 auto',cursor:opt.onClick?'pointer':'default',opacity:opt.dim?0.5:1,userSelect:'none'}},

      E('div',{style:{position:'absolute',inset:w*0.07,border:'1px solid rgba(216,189,126,.5)',borderRadius:w*0.06}}),
      E('div',{style:{position:'absolute',top:'50%',left:'50%',transform:'translate(-50%,-50%)',width:w*0.32,height:w*0.32,borderRadius:'50%',border:'1px solid '+GOLDL,display:'flex',alignItems:'center',justifyContent:'center',color:GOLDL,fontFamily:"'Cormorant Garamond',serif",fontSize:w*0.24,background:'rgba(0,0,0,.18)'}},'\u2726'));}

    const idx=rot=>E('div',{style:{position:'absolute',top:rot?'auto':w*0.06,bottom:rot?w*0.06:'auto',left:rot?'auto':w*0.09,right:rot?w*0.09:'auto',transform:rot?'rotate(180deg)':'none',display:'flex',flexDirection:'column',alignItems:'center',lineHeight:.92,color:main,fontFamily:"'Cormorant Garamond',serif"}},
